<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos - Grão & Massa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index.css">
</head>

<body class="bg-light vh-100 d-flex text-dark">

    <!-- SIDEBAR -->
    <nav class="sidebar d-flex flex-column flex-shrink-0 text-white">

        <div class="p-4 text-center border-bottom border-secondary border-opacity-25 d-flex justify-content-center align-items-center gap-2">
            <svg class="text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>

            <h4 class="m-0 fw-bold">Grão & Massa</h4>
        </div>

        <ul class="nav nav-pills flex-column mb-auto p-3 gap-1">

            <li>
                <a href="#" class="nav-link nav-link-custom d-flex align-items-center gap-3 py-2 px-3">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="#" class="nav-link nav-link-custom active d-flex align-items-center gap-3 py-2 px-3">
                    Cadastro Produtos
                </a>
            </li>

            <li>
                <a href="#" class="nav-link nav-link-custom d-flex align-items-center gap-3 py-2 px-3">
                    Estoque
                </a>
            </li>

            <li>
                <a href="#" class="nav-link nav-link-custom d-flex align-items-center gap-3 py-2 px-3">
                    Relatórios
                </a>
            </li>

        </ul>

    </nav>

    <!-- CONTEÚDO -->
    <div class="d-flex flex-column flex-grow-1 overflow-hidden">

        <!-- HEADER -->
        <header class="bg-white border-bottom p-3 px-4 d-flex justify-content-between align-items-center shadow-sm">

            <div>
                <h5 class="fw-bold m-0">Cadastro de Produtos</h5>
                <small class="text-secondary">
                    Gerencie os produtos da cafeteria
                </small>
            </div>

            <button class="btn btn-brand px-4 py-2 rounded-3 fw-semibold">
                Salvar Produto
            </button>

        </header>

        <!-- MAIN -->
        <main class="flex-grow-1 overflow-auto p-4">

            <div class="row g-4">

                <!-- FORMULÁRIO -->
                <main class="flex-grow-1 overflow-auto p-4">

                    <div class="row justify-content-center">
                
                        <div class="col-lg-10">
                
                            <div class="card form-card p-4">
                
                                <div class="d-flex align-items-center gap-2 section-title mb-4">
                
                                    <h5 class="fw-bold m-0">
                                        Informações do Produto
                                    </h5>
                
                                </div>
                
                                <div class="row g-3">
                
                                    <div class="col-md-8">
                                        <label class="form-label fw-semibold">
                                            Nome do Produto
                                        </label>
                
                                        <input type="text" class="form-control" placeholder="Ex: Pão de forma">
                                    </div>
                
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">
                                            Lote
                                        </label>
                
                                        <input type="text" class="form-control" placeholder="0001">
                                    </div>
                
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">
                                            Categoria
                                        </label>
                
                                        <select class="form-select">
                                            <option>Bebidas</option>
                                            <option>Bolos</option>
                                            <option>Salgados</option>
                                            <option>Doces</option>
                                            <option>Pães</option>
                                        </select>
                                    </div>
                
                                    <div class="col-md-3">
                                        <label class="form-label fw-semibold">
                                            Preço
                                        </label>
                
                                        <input type="number" class="form-control" placeholder="R$ 0,00">
                                    </div>
                
                                    <div class="col-md-3">
                                        <label class="form-label fw-semibold">
                                            Estoque
                                        </label>
                
                                        <input type="number" class="form-control" placeholder="0">
                                    </div>
                
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">
                                            Descrição
                                        </label>
                
                                        <textarea class="form-control" rows="5" placeholder="Descrição do produto..."></textarea>
                                    </div>
                
                                    <div class="col-12">
                                        <button class="btn btn-brand px-4 py-3 rounded-3 fw-semibold">
                                            Cadastrar Produto
                                        </button>
                                    </div>
                
                                </div>
                
                            </div>
                
                        </div>
                
                    </div>
                
                </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
